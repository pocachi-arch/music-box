<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MUSIC BOX</title>
<style>
*{box-sizing:border-box} html,body{ margin:0; padding:0; background:transparent; font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif; color:#171717; } .card{ width:min(100%,420px); margin:0 auto; padding:2px; background:#fff; border-radius:24px; box-shadow:0 8px 30px rgba(0,0,0,.08); } .art{ width:100%; aspect-ratio:1; border-radius:18px; object-fit:cover; background:#eee; display:block; } .info{ text-align:center; padding:16px 6px 8px; } .title{ font-size:18px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .artist{ font-size:13px; color:#777; margin-top:5px; } .times{ display:flex; justify-content:space-between; font-size:10px; color:#888; margin:12px 2px 4px; } input[type=range]{ width:100%; accent-color:#111; } .controls{ display:flex; align-items:center; justify-content:center; gap:24px; margin:14px 0 12px; } button{ border:0; background:transparent; cursor:pointer; color:#111; padding:6px; } .small{ font-size:20px; } .main{ font-size:30px; background:#111; color:#fff; width:58px; height:58px; border-radius:50%; display:flex; align-items:center; justify-content:center; } .bottom{ display:flex; justify-content:center; gap:26px; font-size:12px; color:#777; } .toggle.active{ color:#111; font-weight:700; } #player{ position:absolute; width:1px; height:1px; left:-9999px; top:-9999px; } .note{ text-align:center; color:#aaa; font-size:10px; margin-top:10px; }
</style></head><body>
<div class="card"><img id="art" class="art" alt="ジャケット">
<div class="info"><div id="title" class="title">MUSIC BOX</div><div id="artist" class="artist">YouTube Playlist</div></div>
<div class="times"><span id="current">0:00</span><span id="duration">0:00</span></div>
<input id="seek" type="range" min="0" max="100" value="0">
<div class="controls"><button id="prev" class="small">⏮</button><button id="play" class="main">▶</button><button id="next" class="small">⏭</button></div>
<div class="bottom"><button id="shuffle" class="toggle">🔀 1</button><button id="loop" class="toggle">🔁 リピート</button></div>
<div class="note">MUSIC BOX</div></div><div id="player"></div>
<script>
const PLAYLIST_ID="PLK3dVrptUPDo";let player;
function ytTime(s){s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function updateUI(){if(!player||!player.getDuration)return;let d=player.getDuration()||0,c=player.getCurrentTime()||0;seek.value=d?c/d*100:0;current.textContent=ytTime(c);duration.textContent=ytTime(d)}
function loadInfo(){let d=player.getVideoData?player.getVideoData():{};title.textContent=d.title||"MUSIC BOX";artist.textContent=d.author||"YouTube";if(d.video_id)art.src="https://i.ytimg.com/vi/"+d.video_id+"/hqdefault.jpg"}
function onYouTubeIframeAPIReady(){player=new YT.Player("player",{width:"1",height:"1",playerVars:{playsinline:1,controls:0,rel:0},events:{onReady:e=>{e.target.loadPlaylist({list:PLAYLIST_ID});setInterval(updateUI,500)},onStateChange:e=>{play.textContent=e.data===YT.PlayerState.PLAYING?"Ⅱ":"▶";loadInfo();updateUI()}}})}
play.onclick=()=>{if(!player)return;player.getPlayerState()===YT.PlayerState.PLAYING?player.pauseVideo():player.playVideo()};
prev.onclick=()=>player.previousVideo();next.onclick=()=>player.nextVideo();
seek.oninput=e=>{if(player&&player.getDuration())player.seekTo(player.getDuration()*e.target.value/100,true)};
shuffle.onclick=()=>{shuffle.classList.toggle("active");player.setShuffle(shuffle.classList.contains("active"))};
loop.onclick=()=>{loop.classList.toggle("active");player.setLoop(loop.classList.contains("active"))};
</script><script src="https://www.youtube.com/iframe_api"></script></body></html>
