<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MUSIC BOX</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:transparent;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:#222}
  .box{max-width:420px;margin:auto;background:#fff;border:1px solid #e8e8e8;border-radius:22px;padding:18px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
  .title{font-size:13px;letter-spacing:.12em;font-weight:700;margin-bottom:14px}
  #player{width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#111}
  .controls{display:flex;align-items:center;justify-content:center;gap:12px;margin:14px 0 6px}
  button{border:0;background:#f2f2f2;border-radius:50%;width:42px;height:42px;font-size:16px;cursor:pointer}
  button.main{width:54px;height:54px;font-size:21px;background:#222;color:#fff}
  button.on{background:#222;color:#fff}
  .toggles{display:flex;justify-content:center;gap:8px;margin-top:10px}
  .toggle{width:auto;height:34px;border-radius:17px;padding:0 13px;font-size:12px}
  .status{text-align:center;font-size:11px;color:#888;margin-top:10px;min-height:15px}
  .note{font-size:10px;color:#aaa;text-align:center;margin-top:8px}
</style>
</head>
<body>
<div class="box">
  <div class="title">🎵 MUSIC BOX</div>
  <div id="player"></div>
  <div class="controls">
    <button onclick="prev()" aria-label="前の曲">⏮</button>
    <button class="main" id="play" onclick="togglePlay()" aria-label="再生">▶</button>
    <button onclick="next()" aria-label="次の曲">⏭</button>
  </div>
  <div class="toggles">
    <button class="toggle" id="shuffle" onclick="toggleShuffle()">🔀 シャッフル</button>
    <button class="toggle" id="loop" onclick="toggleLoop()">🔁 リピート</button>
  </div>
  <div class="status" id="status">プレイヤーを読み込み中…</div>
  <div class="note">YouTubeの公開動画を再生します</div>
</div>

<script>
/* ▼ここだけ変更：YouTubeプレイリストID */
const PLAYLIST_ID = "PLK3dVrptUPDo";

let player, shuffle=false, loop=false, ready=false;

function onYouTubeIframeAPIReady(){
  player = new YT.Player('player',{
    width:'100%',height:'100%',
    playerVars:{
      listType:'playlist',
      list:PLAYLIST_ID,
      playsinline:1,
      rel:0
    },
    events:{
      onReady:()=>{ready=true; setStatus("再生する曲を選んでね");},
      onStateChange:e=>{
        if(e.data===YT.PlayerState.PLAYING) document.getElementById('play').textContent='Ⅱ';
        if(e.data===YT.PlayerState.PAUSED || e.data===YT.PlayerState.ENDED) document.getElementById('play').textContent='▶';
      }
    }
  });
}
function togglePlay(){
  if(!ready)return;
  const s=player.getPlayerState();
  if(s===YT.PlayerState.PLAYING) player.pauseVideo();
  else player.playVideo();
}
function next(){if(ready)player.nextVideo()}
function prev(){if(ready)player.previousVideo()}
function toggleShuffle(){
  if(!ready)return;
  shuffle=!shuffle;
  player.setShuffle(shuffle);
  document.getElementById('shuffle').classList.toggle('on',shuffle);
}
function toggleLoop(){
  if(!ready)return;
  loop=!loop;
  player.setLoop(loop);
  document.getElementById('loop').classList.toggle('on',loop);
}
function setStatus(t){document.getElementById('status').textContent=t}

const tag=document.createElement('script');
tag.src="https://www.youtube.com/iframe_api";
document.head.appendChild(tag);
</script>
</body>
</html>
